[project]
name = "workflow-monitor"
version = "0.1.0"
description = "Tool for reconstructing and visualizing order processing workflows."
requires-python = ">=3.13"

dependencies = [
    "httpx",
    "pydantic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"